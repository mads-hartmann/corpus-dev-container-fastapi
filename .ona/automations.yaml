tasks:
  installDeps:
    name: Install dependencies
    description: Install the FastAPI app and its dependencies in editable mode.
    command: |
      python -m pip install -e .
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

services:
  devServer:
    name: FastAPI Dev Server
    description: Run the FastAPI development server with auto-reload.
    commands:
      start: |
        fastapi dev app/main.py --host 0.0.0.0 --port 8000
      ready: |
        curl -sf http://localhost:8000/
