tasks:
  installDeps:
    name: Install dependencies
    description: Install the project and its dependencies in editable mode.
    command: |
      python -m pip install -e .
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

services:
  dev-server:
    name: FastAPI Dev Server
    description: Run the FastAPI development server.
    commands:
      start: |
        ona environment port open 8000 --admission creator_only --name dev-server
        fastapi dev app/main.py --host 0.0.0.0 --port 8000
      ready: |
        curl -sf http://localhost:8000/
