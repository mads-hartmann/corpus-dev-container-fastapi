tasks:
  install-dependencies:
    name: Install dependencies
    description: Install the FastAPI application in editable mode.
    command: python -m pip install --editable .
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

services:
  api:
    name: FastAPI server
    description: Run the FastAPI development server.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 8000 --admission creator_only --name "FastAPI server" --protocol http
        fastapi dev app/main.py --host 0.0.0.0 --port 8000
      ready: curl -fsS http://localhost:8000/ >/dev/null
