[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-dev-container-fastapi"
version = "0.1.0"
description = "A minimal FastAPI starter app for dev container setup testing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
